[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantryctl"
version = "1.5.0"
description = "Crane gantry scheduling and load-envelope checks for container terminals"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gantryctl = "gantryctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
